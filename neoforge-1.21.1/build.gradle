plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'dev.mrmulle.createoxidized'

base {
    archivesName = 'createoxidized-neoforge-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.resources.srcDirs('../common/src/main/resources', 'src/generated/resources')

repositories {
    maven { url = 'https://maven.createmod.net' }
}

dependencies {
    compileOnly('com.simibubi.create:create-1.21.1:6.0.10-281') {
        transitive = false
    }
    compileOnly 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
    runtimeOnly('com.simibubi.create:create-1.21.1:6.0.10-281') {
        transitive = false
    }
}

neoForge {
    version = '21.1.230'

    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        createoxidized {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes('MixinConfigs': 'createoxidized.mixins.json')
    }
}

