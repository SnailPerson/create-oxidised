plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

version = '1.0.0'
group = 'dev.mrmulle.createoxidized'

base {
    archivesName = 'createoxidized-forge-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.resources.srcDirs('../common/src/main/resources', 'src/generated/resources')

repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/mirror' }
    mavenCentral()
}

dependencies {
    modImplementation('com.simibubi.create:create-1.20.1:6.0.8-289:slim') {
        transitive = false
    }
    modImplementation 'net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91'
    modCompileOnly 'dev.engine-room.flywheel:flywheel-forge-api-1.20.1:1.0.5'
    modRuntimeOnly 'dev.engine-room.flywheel:flywheel-forge-1.20.1:1.0.5'
    modImplementation 'com.tterrag.registrate:Registrate:MC1.20-1.3.3'
    compileOnly annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1')
    implementation 'io.github.llamalad7:mixinextras-forge:0.4.1'
}

legacyForge {
    version = '1.20.1-47.1.33'

    parchment {
        minecraftVersion = '1.20.1'
        mappingsVersion = '2023.09.03'
    }

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        createoxidized {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes('MixinConfigs': 'createoxidized.mixins.json')
    }
}

